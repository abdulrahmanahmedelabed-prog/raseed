# ينشر صفحة رصيد على GitHub Pages مع كل تحديث، وملفات التنزيل من آخر إصدار تُنسخ داخل الموقع نفسه (download/)
# فلا يحتاج الزائر للذهاب إلى أي صفحة أخرى. يُعاد النشر يومياً ليلتقط الإصدارات الجديدة.
# مرة واحدة: Settings ← Pages ← Build and deployment ← Source: GitHub Actions
name: pages
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download files from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          mkdir -p download
          # الإصدارات تُبنى وتُنشر في هذا المستودع (release.yml): ملفات التشغيل فقط، بلا شيفرة مصدرية
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null); then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir download -p Raseed-Setup.exe -p Raseed-Windows-Portable.zip \
              -p Raseed-Linux.tar.gz -p docker-compose.yml -p SHA256SUMS.txt
            # نسخة أوراكل أبكس (منذ 1.5.4)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir download -p 'Raseed-APEX-install-*.sql' -p f153_raseed_apex.sql \
              -p Raseed-APEX.zip || echo "no APEX files in $tag"
            # نسخة التدريب في أبكس (منذ 1.6.0)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir download -p f154_raseed_training.sql -p 4_training.sql \
              || echo "no APEX training files in $tag"
          else  # قبل أول إصدار هنا: آخر إصدار في مستودع البرنامج الخاص
            app=abdulrahmanahmedelabed-prog/university_accounting
            export GH_TOKEN="$APP_REPO_TOKEN"
            tag=$(gh release view --repo "$app" --json tagName -q .tagName)
            gh release download "$tag" --repo "$app" --dir download -p Raseed-Setup.exe -p Raseed-Windows-Portable.zip -p Raseed-Linux.tar.gz -p SHA256SUMS.txt
            gh api -H "Accept: application/vnd.github.raw" "repos/$app/contents/docker-compose.yml?ref=$tag" | sed '/^[[:space:]]*build: \.$/d' > download/docker-compose.yml
            (cd download && sha256sum docker-compose.yml >> SHA256SUMS.txt)
          fi
          grep -E ' (Raseed-Setup\.exe|Raseed-Windows-Portable\.zip|Raseed-Linux\.tar\.gz|docker-compose\.yml|Raseed-APEX-install-[0-9]+\.sql|f153_raseed_apex\.sql|f154_raseed_training\.sql|4_training\.sql|Raseed-APEX\.zip)$' download/SHA256SUMS.txt > download/sums && mv download/sums download/SHA256SUMS.txt
          (cd download && for f in $(awk '{print $2}' SHA256SUMS.txt); do [ -e "$f" ] || sed -i "/ $f\$/d" SHA256SUMS.txt; done)
          # أزرار أجزاء سكربت أبكس بعددها في هذا الإصدار
          links=""
          for f in $(ls download/Raseed-APEX-install-*.sql 2>/dev/null | sort -V); do
            n=$(basename "$f" .sql); n=${n##*-}
            links="$links<a class=\"btn\" href=\"download/$(basename "$f")\">${n}. السكربت، الجزء ${n} ($(basename "$f"))<\/a>"
          done
          sed -i "s|<!--APEX-->.*<!--/APEX-->|<!--APEX-->$links<!--/APEX-->|" index.html
          grep -q "image:" download/docker-compose.yml
          (cd download && sha256sum -c SHA256SUMS.txt)
          sed -i "s/الإصدار [0-9][0-9.]* ·/الإصدار ${tag#v} ·/" index.html
          grep -q "الإصدار ${tag#v} ·" index.html
          ls -l download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
