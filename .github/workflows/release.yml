# يبني ملفات تنزيل رصيد من مستودع البرنامج الخاص وينشرها إصداراً في هذا المستودع العام، ثم يحدّث صفحة التنزيل.
# الشيفرة المصدرية لا تُنشر: نسخة ويندوز (المثبّت والمحمولة) مترجمة بـ Nuitka إلى ملف تنفيذي بلا ملفات شيفرة،
# ومعها حزمة لينكس وصورة Docker، ونسخة أوراكل أبكس (سكربت SQL Workshop أجزاءً دون 500 كيلوبايت بحزم مغلّفة بـ
# DBMS_DDL.WRAP على Oracle 11g في الحاوية، وتطبيق أبكس 153).
#
# التشغيل: من تبويب Actions (الإصدار ونسخة البرنامج: وسم أو فرع أو رقم إيداع)، أو بدفع وسم v* إلى هذا المستودع
# يطابق وسماً بالاسم نفسه في مستودع البرنامج.
# أسرار مطلوبة (Settings ← Secrets and variables ← Actions):
#   APP_REPO_TOKEN    رمز قراءة فقط لمستودع البرنامج الخاص (Contents: Read)
#   RASEED_ROOT_KEY   المفتاح الجذري للمورّد (محتوى ~/.ua_vendor/root.key من license_admin.py init) لنسخة موقّعة محمية؛
#                     بدونه تُبنى نسخة مطوّر غير موقعة كما في الإصدارات السابقة، مع تنبيه في سجل البناء
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "اسم الإصدار (مثل v1.2.0)؛ يجب أن يطابق VERSION في البرنامج"
        required: true
      ref:
        description: "نسخة البرنامج التي تُبنى: وسم أو فرع أو رقم إيداع (فارغ = الوسم نفسه)"
        required: false
permissions:
  contents: write
  packages: write
  actions: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  APP_REF: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}
  APP_REPO: abdulrahmanahmedelabed-prog/university_accounting

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          RASEED_ROOT_KEY: ${{ secrets.RASEED_ROOT_KEY }}
        run: |
          [ -n "$APP_REPO_TOKEN" ] || { echo "::error::أضف السر APP_REPO_TOKEN (قراءة مستودع البرنامج)"; exit 1; }
          [ -n "$RASEED_ROOT_KEY" ] || echo "::warning::السر RASEED_ROOT_KEY غير موجود: تُبنى نسخة مطوّر غير موقعة. أضفه لنسخة موقّعة محمية"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build the Linux package
        env:
          RASEED_ROOT_KEY: ${{ secrets.RASEED_ROOT_KEY }}
        run: python tools/build_release.py --expect-version "$TAG" --targets linux
      - name: Smoke test the Linux package
        run: |
          mkdir -p /tmp/s && tar xzf dist/Raseed-Linux.tar.gz -C /tmp/s
          # بعدد العمليات الافتراضي: يكشف تعارض العمليات عند أول تشغيل، وبسجل بترميز لا يحمل العربية كخدمة ويندوز بلغة أخرى
          RASEED_DATA=/tmp/s/data PYTHONIOENCODING=cp1252 python /tmp/s/raseed/app/run.py --no-browser --port 8890 > /tmp/s/server.log 2>&1 &
          for i in $(seq 40); do curl -sf localhost:8890/api/status && break; sleep 1; done
          curl -sf localhost:8890/api/status | grep -q '"product"'
          sleep 3; cat /tmp/s/server.log; ! grep -q Traceback /tmp/s/server.log
      - name: Smoke test the training edition (progress while preparing, then the full server)
        run: |
          RASEED_DATA=/tmp/s/data python /tmp/s/raseed/app/run.py --training --scale test --no-browser --port 8892 > /tmp/s/training.log 2>&1 &
          seen=""
          for i in $(seq 180); do
            st=$(curl -s localhost:8892/api/status || true)
            case "$st" in *preparing*) seen=1 ;; *needs_setup*) break ;; esac
            sleep 1
          done
          echo "$st" | grep -q needs_setup
          curl -s -o /dev/null -w '%{http_code}\n' localhost:8892/ | grep -q 200
          cat /tmp/s/training.log; ! grep -q Traceback /tmp/s/training.log
          echo "progress screen seen: ${seen:-no (finished before the first check)}"
      - name: Docker compose file for download (pulls the published image, no build)
        run: |
          sed '/^[[:space:]]*build: \.$/d' docker-compose.yml > dist/docker-compose.yml
          grep -q "image:" dist/docker-compose.yml
          cp packaging/RELEASE_NOTES.md dist-notes.md
          printf '\n\n<sub>بُني من نسخة البرنامج %s</sub>\n' "$(git rev-parse --short HEAD)" >> dist-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: dist-notes.md

  windows:
    needs: build
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # سجلات البناء وNuitka بالعربية على طرفية ويندوز
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests on Windows
        run: python -m unittest discover -s tests
      - name: Compile the Windows edition with Nuitka (no source files shipped)
        env:
          RASEED_ROOT_KEY: ${{ secrets.RASEED_ROOT_KEY }}
        run: |
          python -m pip install --quiet nuitka ordered-set zstandard oracledb
          python tools/build_release.py --expect-version "$env:TAG" --targets windows --compiled
      - name: Smoke test Raseed.exe
        shell: pwsh
        run: |
          $exe = "build\windows\Raseed\app\Raseed.exe"
          if (Get-ChildItem build\windows\Raseed -Recurse -Filter *.py) { throw "source files in the compiled edition" }
          $t = & $exe --self-test
          Write-Host $t
          if ($LASTEXITCODE -ne 0) { throw "self test failed" }
          if (-not ($t | ConvertFrom-Json).oracledb) { throw "oracledb missing from the compiled edition" }
          $env:RASEED_DATA = "$env:RUNNER_TEMP\rd"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser", "--port", "8891" -PassThru
          $r = $null
          for ($i = 0; $i -lt 60 -and -not $r; $i++) { try { $r = Invoke-RestMethod http://localhost:8891/api/status } catch { Start-Sleep 1 } }
          $ui = (Invoke-WebRequest http://localhost:8891/core.js -UseBasicParsing).StatusCode
          Stop-Process -Id $p.Id -Force
          if (-not $r.product -or $ui -ne 200) { throw "server did not start" }
          Write-Host "server ok: $($r.product) $($r.version)"
          # نسخة التدريب: شاشة التجهيز ثم الخادم الكامل، وعملية التحقق الكامل في الخلفية تعمل من الملف المترجم
          $p = Start-Process -FilePath $exe -ArgumentList "--training", "--scale", "test", "--no-browser", "--port", "8893" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 240 -and -not $ready; $i++) { try { $s = Invoke-RestMethod http://localhost:8893/api/status; $ready = -not $s.preparing -and $s.product } catch { }; if (-not $ready) { Start-Sleep 1 } }
          Stop-Process -Id $p.Id -Force
          if (-not $ready) { throw "training edition did not become ready" }
          Write-Host "training edition ok"
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" packaging\windows\raseed.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Silent install test
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Raseed-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$env:RUNNER_TEMP\ri" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\ri\app\Raseed.exe")) { throw "install failed" }
          if (Test-Path "$env:RUNNER_TEMP\ri\app\run.py") { throw "source file installed" }
          Write-Host "installer ok"
      - name: Autostart test (scheduled task, browser hand-off, removal)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $app = "$env:RUNNER_TEMP\ri"
          cmd /c "$app\Install-Autostart.bat < NUL"
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) { try { $r = Invoke-RestMethod http://localhost:8800/api/status } catch { Start-Sleep 1 } }
          if (-not $r.product) { Get-Content "$app\data\server.log" -ErrorAction SilentlyContinue; throw "service did not start" }
          $task = Get-ScheduledTask -TaskName "Raseed Server"
          Write-Host "task: $($task.State), time limit $($task.Settings.ExecutionTimeLimit), on batteries $(-not $task.Settings.DisallowStartIfOnBatteries)"
          if ($task.Settings.ExecutionTimeLimit -ne "PT0S") { throw "the server task has a run time limit" }
          Get-Content "$app\data\server.log"
          cmd /c "$app\Remove-Autostart.bat < NUL"
          Start-Sleep 3
          if (Get-NetTCPConnection -LocalPort 8800 -State Listen -ErrorAction SilentlyContinue) { throw "server still running after Remove-Autostart" }
          Write-Host "autostart ok"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Raseed-Setup.exe
            dist/Raseed-Windows-Portable.zip

  apex:
    needs: build
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:11-slim-faststart
        env:
          ORACLE_PASSWORD: Raseed2026
        ports: ["1521:1521"]
        options: --shm-size=1g --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 40
    env:
      RSD_ORA_DSN: 127.0.0.1:1521/XE
      RSD_ORA_SYSTEM: Raseed2026
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Oracle Instant Client 19 (Oracle 11g needs the thick client)
        run: |
          sudo apt-get update -qq && (sudo apt-get install -y -qq libaio1t64 || sudo apt-get install -y -qq libaio1)
          [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] || sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          curl -sSLo ic.zip https://download.oracle.com/otn_software/linux/instantclient/1928000/instantclient-basiclite-linux.x64-19.28.0.0.0dbru.zip
          unzip -q ic.zip -d "$RUNNER_TEMP/ic"
          echo "RSD_ORA_CLIENT=$RUNNER_TEMP/ic/instantclient_19_28" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ic/instantclient_19_28" >> "$GITHUB_ENV"
          python -m pip install --quiet oracledb pytest
      - name: Build the APEX edition (package bodies wrapped, vendor key in the licence package)
        env:
          RASEED_ROOT_KEY: ${{ secrets.RASEED_ROOT_KEY }}
        run: python tools/build_release.py --expect-version "$TAG" --targets apex --out dist-apex
      - name: Install test (check, install, verify, use, install again; the wrapped file too)
        run: |
          grep -c " wrapped" dist-apex/Raseed-APEX-install-1.sql
          ! grep -q "PACKAGE BODY RSD_[A-Z_]* AS" dist-apex/Raseed-APEX-install-*.sql
          # SQL Workshop ← SQL Scripts لا يقبل ملفاً فوق 500 كيلوبايت
          for f in dist-apex/Raseed-APEX-install-*.sql; do [ "$(stat -c%s "$f")" -lt 500000 ] || { echo "::error::$f too big"; exit 1; }; done
          python -m pytest -q apex/tests/test_workshop.py
          rm -f dist-apex/SHA256SUMS.txt && ls -l dist-apex
      - uses: actions/upload-artifact@v4
        with:
          name: apex
          path: dist-apex/

  docker:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abdulrahmanahmedelabed-prog/raseed:${{ env.TAG }}
            ghcr.io/abdulrahmanahmedelabed-prog/raseed:latest

  publish:
    needs: [build, windows, apex]
    # نسخة أبكس لا توقف الإصدار: إن فشل بناؤها نُشرت بقية الملفات وظهر التنبيه
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apex
          path: dist
      - name: APEX files present
        run: ls dist/Raseed-APEX-install-1.sql dist/f153_raseed_apex.sql dist/Raseed-APEX.zip || echo "::warning::نسخة أبكس لم تُبنَ في هذا الإصدار"
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "رصيد $VER — النظام المالي للجامعات" --notes-file dist-notes.md --latest
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "رصيد $VER — النظام المالي للجامعات" --notes-file dist-notes.md --latest
          fi
      - name: Refresh the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
