# ينشر صفحة رصيد على GitHub Pages مع كل تحديث، وملفات التنزيل من آخر إصدار تُنسخ داخل الموقع نفسه (download/)
# فلا يحتاج الزائر للذهاب إلى أي صفحة أخرى. يُعاد النشر يومياً ليلتقط الإصدارات الجديدة.
# مرة واحدة: Settings ← Pages ← Build and deployment ← Source: GitHub Actions
name: pages
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download files from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          mkdir -p download
          # الإصدارات تُبنى وتُنشر في هذا المستودع (release.yml): ملفات التشغيل فقط، بلا شيفرة مصدرية
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null); then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir download -p Raseed-Setup.exe -p Raseed-Windows-Portable.zip \
              -p Raseed-Linux.tar.gz -p docker-compose.yml -p SHA256SUMS.txt
          else  # قبل أول إصدار هنا: آخر إصدار في مستودع البرنامج الخاص
            app=abdulrahmanahmedelabed-prog/university_accounting
            export GH_TOKEN="$APP_REPO_TOKEN"
            tag=$(gh release view --repo "$app" --json tagName -q .tagName)
            gh release download "$tag" --repo "$app" --dir download -p Raseed-Setup.exe -p Raseed-Windows-Portable.zip -p Raseed-Linux.tar.gz -p SHA256SUMS.txt
            gh api -H "Accept: application/vnd.github.raw" "repos/$app/contents/docker-compose.yml?ref=$tag" | sed '/^[[:space:]]*build: \.$/d' > download/docker-compose.yml
            (cd download && sha256sum docker-compose.yml >> SHA256SUMS.txt)
          fi
          grep -E ' (Raseed-Setup\.exe|Raseed-Windows-Portable\.zip|Raseed-Linux\.tar\.gz|docker-compose\.yml)$' download/SHA256SUMS.txt > download/sums && mv download/sums download/SHA256SUMS.txt
          grep -q "image:" download/docker-compose.yml
          (cd download && sha256sum -c SHA256SUMS.txt)
          sed -i "s/الإصدار [0-9][0-9.]* ·/الإصدار ${tag#v} ·/" index.html
          grep -q "الإصدار ${tag#v} ·" index.html
          ls -l download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
